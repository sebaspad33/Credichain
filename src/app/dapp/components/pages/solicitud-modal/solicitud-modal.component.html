<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-4xl h-[500px] flex flex-col">

    <!-- Título -->
    <div class="bg-gradient-to-r from-red-700 via-red-600 to-red-800 p-4">
      <h2 class="text-2xl font-bold text-center text-white">Solicitudes de Crédito</h2>
    </div>

    <!-- Contenido con scroll -->
    <div class="flex-1 overflow-y-auto p-6">
      <div *ngIf="solicitudes.length === 0" class="text-center text-gray-600">
        No hay solicitudes pendientes.
      </div>

      <div *ngFor="let solicitud of solicitudes"
           class="bg-gray-100 rounded-lg shadow-md p-4 mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div class="flex-1 grid grid-cols-2 gap-x-4 gap-y-2 text-sm text-gray-800">
          <div><strong>Usuario:</strong> {{ shortenAddress(solicitud.usuario) }}</div>
          <div><strong>Monto:</strong> ETH {{ solicitud.monto }}</div>
          <div><strong>Plazo:</strong> {{ solicitud.plazo }}</div>
          <div><strong>DNI:</strong> {{ solicitud.dni }}</div>
          <div><strong>Celular:</strong> {{ solicitud.celular }}</div>
          <div><strong>Estado:</strong> {{ solicitud.estado }}</div>
        </div>

        <div class="flex flex-col items-center gap-2">
          <img *ngIf="solicitud.dniImagen" [src]="solicitud.dniImagen" alt="DNI" class="h-20 rounded border"/>
          <div class="flex gap-2 mt-2">
            <button class="px-4 py-1 bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-50"
                    (click)="acceptSoli(solicitud)"
                    [disabled]="solicitud.estado !== 'pendiente'">
              Aceptar
            </button>
            <button class="px-4 py-1 bg-red-600 text-white rounded hover:bg-red-700 disabled:opacity-50"
                    (click)="rejectSoli(solicitud.idSolicitud)"
                    [disabled]="solicitud.estado !== 'pendiente'">
              Rechazar
            </button>
          </div>
          <div *ngIf="solicitud.estado !== 'pendiente'" class="text-sm font-medium text-gray-600 mt-1">
            Ya revisado
          </div>
        </div>
      </div>
    </div>

    <!-- Botón fijo abajo -->
    <div class="p-4 border-t border-gray-300 flex justify-end bg-white">
      <button (click)="cerrarModal()" class="px-5 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
        Cerrar
      </button>
    </div>
  </div>
</div>
