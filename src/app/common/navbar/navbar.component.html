<!-- Navbar -->
<nav class="bg-gradient-to-r from-red-700 via-red-600 to-red-800 text-white px-6 shadow-md">
  <div class="mx-auto max-w-screen-xl flex h-16 items-center justify-between">

    <!-- Contenedor del menú hamburguesa -->
    <div class="relative flex items-center gap-4">

      <!-- Botón hamburguesa -->
      <button (click)="toggleMenuAbierto()"
        class="p-2 rounded-md hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-red-400">
        <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- Logo y título-->
      <div class="flex items-center gap-2">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" alt="Logo" class="w-8">
        <h1 class="text-2xl font-extrabold">CrediChain</h1>
      </div>

      <!-- Menú desplegable del hamburguesa -->
      <div *ngIf="menuAbierto"
        class="absolute top-full left-0 mt-2 w-full max-w-[300px] bg-white text-gray-700 rounded-lg shadow-lg ring-1 ring-gray-300">
        <ul class="py-2">

          <li>
            <button class="flex items-center gap-3 w-full text-left px-4 py-2 hover:bg-red-500 hover:text-white">

              <svg class="h-5 w-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 4.5l3.09 1.79-.83 3.62h-4.52l-.83-3.62L12 4.5zm0 0v3.62m6.5 9.38l-3.09-1.79-.83-3.62h-4.52l-.83 3.62L5.5 17.5m6.5 0v-3.62" />
              </svg>
              <span>General</span>
            </button>
          </li>

          <li>
            <button class="flex items-center gap-3 w-full text-left px-4 py-2 hover:bg-red-500 hover:text-white"
                    (click)="abrirModalContactos()">
              <svg class="h-5 w-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 3h12M5 8h12M5 13h8M5 18h4M7 3v16M17 3v16" />
              </svg>
              <span>Contactos</span>
            </button>
          </li>
          <!-- Modal de contactos -->
          <app-contacto-modal *ngIf="mostrarContactoModal" (close)="cerrarModalContactos()">
          </app-contacto-modal>

          <li>
            <button class="flex items-center gap-3 w-full text-left px-4 py-2 hover:bg-red-500 hover:text-white">
              <svg class="h-5 w-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8c4.418 0 8-1.79 8-4s-3.582-4-8-4-8 1.79-8 4 3.582 4 8 4zm0 0v4m0 4v4m8-8c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
              </svg>
              <span>Pagos</span>
            </button>
          </li>

          <li>
            <button class="flex items-center gap-3 w-full text-left px-4 py-2 hover:bg-red-500 hover:text-white"
            (click)="abrirModalSolicitudes()">
              <svg class="h-5 w-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12a4 4 0 118 0 4 4 0 01-8 0zM4 19h16M5 19v-3a5 5 0 0110 0v3M19 19v-3a5 5 0 00-10 0v3" />
              </svg>
              <span>Solicitudes</span>
            </button>
          </li>
          <!-- Modal de solicitudes -->
          <app-solicitud-modal *ngIf="mostrarSolicitudModal" (close)="cerrarModalSolicitudes()">
          </app-solicitud-modal>

          <li>
            <button class="flex items-center gap-3 w-full text-left px-4 py-2 hover:bg-red-500 hover:text-white">
              <svg class="h-5 w-5 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 4v16M4 12h16M7 7h10M7 17h10" />
              </svg>
              <span>Acerca de</span>
            </button>
          </li>

        </ul>
      </div>



    </div>

    <!-- MENÚ DE USUARIO -->
    <div class="relative">
      <button (click)="toggleUserMenu()"
        class="flex items-center gap-3 rounded-full bg-red-900 px-4 py-2 hover:bg-red-800 transition">

        <!-- Avatar -->
        <div class="relative">
          <img class="h-10 w-10 rounded-full border-2 border-gray-500 object-cover" [src]="avatarUrl"
            alt="User avatar" />
          <div class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-red-900 bg-green-500"></div>
        </div>

        <!-- Nombre -->
        <div class="text-left">
          <p class="text-sm font-semibold">{{ shortened || 'Usuario' }}</p>
          <p class="text-xs text-gray-300">Conectado</p>
        </div>
      </button>

      <!-- Menú desplegable de usuario -->
      <div *ngIf="userMenuOpen"
        class="absolute right-0 mt-2 w-64 bg-white text-gray-800 rounded-xl shadow-lg ring-1 ring-gray-300">

        <!-- Información del usuario -->
        <div class="p-4 border-b">
          <p class="font-semibold">{{ shortened || 'Usuario' }}</p>
          <p class="text-sm text-gray-500 truncate max-w-[150px]" title="{{ address }}">
            {{ address || 'No disponible' }}
          </p>
          <button (click)="copiarUsuario(address)" class="text-gray-500 hover:text-black focus:outline-none"
            title="Copiar dirección">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 16h8M8 12h8m-6 8h6a2 2 0 002-2V8a2 2 0 00-2-2h-6l-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h2" />
            </svg>
          </button>
        </div>

        <!-- Opciones del usuario -->
        <div class="py-2">
          <a href="#" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100">
            <svg class="h-5 w-5 text-gray-800" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span>Mi Perfil</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100">
            <svg class="h-5 w-5 text-gray-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 2a2 2 0 012 2v2a2 2 0 01-2 2m0 4a2 2 0 012 2v2a2 2 0 01-2 2m-6-6h12m-6 6h6M6 6h6" />
            </svg>
            <span>Configuración</span>
          </a>
        </div>

        <!-- Cerrar sesión -->
        <div class="py-2 border-t">
          <a (click)="logout()" class="flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-100">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1..." />
            </svg>
            <span>Cerrar Sesión</span>
          </a>
        </div>

      </div>
    </div>

  </div>
</nav>
