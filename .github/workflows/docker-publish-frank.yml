name: Desplegando a Docker Hub en Accion ....

on:
  push:
    branches:
      - backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cache de dependencias Maven (opcional, acelera builds)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build y test del backend
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # 5. Login a Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN_FRANK }}" | docker login -u "${{ secrets.DOCKER_USERNAME_FRANK }}" --password-stdin

      # 6. Construir la imagen Docker
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME_FRANK }}/credichain-backend:latest .

      # 7. Push a Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME_FRANK }}/credichain-backend:latest
